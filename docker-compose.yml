services:
  valkey:
    image: valkey/valkey:8.0-alpine
    container_name: valkey_topdoctors
    ports:
      - "6379:6379"
    restart: always
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: topdoctors-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - REDIS_HOST=valkey
      - REDIS_PORT=6379
      - NODE_ENV=production
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: always